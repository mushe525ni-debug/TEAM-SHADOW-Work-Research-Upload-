<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Shadow — Find Problems. Build Solutions.</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--ts-primary:#7c5cff;--ts-primary-2:#a78bfa;--ts-bg:#0a0a12;--ts-surface:#11121c;--ts-border:#1d1f2e;--ts-muted:#8a8aa0;--ts-text:#e9e9f1;--ts-navbar:rgba(10,10,18,.85);}
[data-bs-theme="light"]{--ts-bg:#f7f7fb;--ts-surface:#fff;--ts-border:#e5e7ef;--ts-muted:#6b7280;--ts-text:#14141f;--ts-navbar:rgba(255,255,255,.92);}
body{background:var(--ts-bg);min-height:100vh;color:var(--ts-text);transition:background .3s;}
.hero{background:radial-gradient(circle at 30% 20%,rgba(124,92,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(167,139,250,.1),transparent 55%);padding:60px 0;}
.text-primary{color:var(--ts-primary-2)!important;}
.btn-primary{background:var(--ts-primary);border-color:var(--ts-primary);color:#fff;}
.btn-primary:hover,.btn-primary:focus{background:#6d4cff;border-color:#6d4cff;color:#fff;}
.brand-mark{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,var(--ts-primary),var(--ts-primary-2));color:#fff;}
.card,.panel{background:var(--ts-surface);border:1px solid var(--ts-border);border-radius:14px;color:var(--ts-text);}
.stat-card{padding:1.1rem;transition:transform .15s,border-color .15s;cursor:pointer;position:relative;}
.stat-card:hover{transform:translateY(-3px);border-color:var(--ts-primary);box-shadow:0 8px 25px rgba(124,92,255,.15);}
.stat-card::after{content:'→';position:absolute;top:12px;right:14px;color:var(--ts-muted);opacity:.5;font-size:1rem;transition:all .2s;}
.stat-card:hover::after{opacity:1;color:var(--ts-primary-2);transform:translateX(4px);}
.stat-card.no-arrow::after{display:none;}
.stat-value{font-size:1.7rem;font-weight:700;line-height:1;}
.stat-label{color:var(--ts-muted);font-size:.82rem;margin-top:.35rem;}
.badge-status{font-size:.7rem;padding:.3rem .65rem;border-radius:100px;font-weight:600;display:inline-block;}
.status-draft{background:rgba(138,138,160,.15);color:var(--ts-muted);}
.status-submitted{background:rgba(34,211,238,.15);color:#22d3ee;}
.status-under_review{background:rgba(251,191,36,.15);color:#fbbf24;}
.status-approved{background:rgba(52,211,153,.15);color:#34d399;}
.status-archived{background:rgba(138,138,160,.15);color:#64748b;}
.status-pending{background:rgba(251,191,36,.15);color:#fbbf24;}
.status-active{background:rgba(52,211,153,.15);color:#34d399;}
.status-suspended{background:rgba(248,113,113,.15);color:#f87171;}
.status-deactivated{background:rgba(138,138,160,.15);color:#64748b;}
.role-founder{background:rgba(255,215,0,.15);color:#ffd700;}
.role-member{background:rgba(124,92,255,.15);color:var(--ts-primary-2);}
.role-pill{font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:100px;display:inline-block;}
.sidebar{background:var(--ts-surface);border-right:1px solid var(--ts-border);min-height:calc(100vh - 64px);padding:1rem .5rem;position:sticky;top:64px;}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;border-radius:10px;color:var(--ts-muted);text-decoration:none;font-size:.9rem;transition:all .15s;margin-bottom:.15rem;cursor:pointer;}
.sidebar-link:hover{background:rgba(124,92,255,.08);color:var(--ts-text);}
.sidebar-link.active{background:rgba(124,92,255,.15);color:var(--ts-primary-2);font-weight:600;}
.sidebar-link i{font-size:1.05rem;width:20px;}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ts-muted);}
.empty-state i{font-size:2.5rem;opacity:.4;display:block;margin-bottom:.75rem;}
.form-control,.form-select{background:rgba(0,0,0,.2);border-color:var(--ts-border);color:inherit;}
[data-bs-theme="light"] .form-control,[data-bs-theme="light"] .form-select{background:#fbfbfe;color:#111;}
.form-control:focus,.form-select:focus{background:rgba(0,0,0,.3);border-color:var(--ts-primary);color:inherit;box-shadow:0 0 0 .2rem rgba(124,92,255,.15);}
[data-bs-theme="light"] .form-control:focus,[data-bs-theme="light"] .form-select:focus{background:#fff;color:#111;}
.toast-stack{position:fixed;top:1rem;right:1rem;z-index:3000;display:flex;flex-direction:column;gap:.5rem;max-width:400px;}
.ts-toast{padding:.85rem 1rem;border-radius:12px;background:var(--ts-surface);border:1px solid var(--ts-border);box-shadow:0 12px 40px rgba(0,0,0,.4);animation:toastIn .2s ease;display:flex;align-items:flex-start;gap:.75rem;font-size:.9rem;color:var(--ts-text);}
.ts-toast.success{border-color:rgba(52,211,153,.4);}.ts-toast.success i{color:#34d399;}
.ts-toast.danger{border-color:rgba(248,113,113,.4);}.ts-toast.danger i{color:#f87171;}
.ts-toast.info{border-color:rgba(34,211,238,.4);}.ts-toast.info i{color:#22d3ee;}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.activity-item{padding:.55rem 0;border-bottom:1px solid var(--ts-border);font-size:.85rem;}
.activity-item:last-child{border-bottom:0;}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--ts-primary);display:inline-block;margin-right:.6rem;}
.version-item{padding:.6rem 0;border-bottom:1px solid var(--ts-border);font-size:.85rem;}
.version-item:last-child{border-bottom:0;}
.notif-item{padding:.75rem 1rem;border-bottom:1px solid var(--ts-border);display:flex;gap:.75rem;align-items:flex-start;}
.notif-item.unread{background:rgba(124,92,255,.05);}
.notif-item:last-child{border-bottom:0;}
.ts-navbar{background:var(--ts-navbar)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ts-border)!important;transition:background .3s;}
.ts-navbar .nav-link,.ts-navbar .navbar-brand{color:var(--ts-text)!important;}
.ts-navbar .nav-link:hover{color:var(--ts-primary-2)!important;}
.ts-navbar .dropdown-menu{background:var(--ts-surface);border:1px solid var(--ts-border);box-shadow:0 8px 30px rgba(0,0,0,.25);}
.ts-navbar .dropdown-item{color:var(--ts-text);}
.ts-navbar .dropdown-item:hover{background:rgba(124,92,255,.12);color:var(--ts-primary-2);}
.ts-navbar .dropdown-divider{border-color:var(--ts-border);}
[data-bs-theme="light"] .ts-navbar .navbar-toggler{border-color:#ccc;}
[data-bs-theme="light"] .ts-navbar .navbar-toggler-icon{filter:invert(0);}
.avatar-sm{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--ts-border);}
.avatar-md{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--ts-border);}
.avatar-lg{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--ts-primary);}
.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ts-primary),var(--ts-primary-2));color:#fff;font-weight:700;}
.file-drop{border:2px dashed var(--ts-border);border-radius:12px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .15s;background:rgba(124,92,255,.03);}
.file-drop:hover{border-color:var(--ts-primary);background:rgba(124,92,255,.08);}
.file-drop i{font-size:2rem;color:var(--ts-primary-2);}
.file-preview{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;background:rgba(124,92,255,.06);border:1px solid var(--ts-border);border-radius:10px;margin-bottom:.5rem;flex-wrap:wrap;}
.file-preview i.file-ic{font-size:1.5rem;color:var(--ts-primary-2);flex-shrink:0;}
.file-preview .file-info{flex-grow:1;min-width:0;}
.file-preview .file-name{font-weight:500;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-preview .file-meta{font-size:.72rem;color:var(--ts-muted);}
.file-preview .file-actions{display:flex;gap:.35rem;flex-wrap:wrap;}
.detail-row{display:flex;padding:.65rem 0;border-bottom:1px solid var(--ts-border);}
.detail-row:last-child{border-bottom:0;}
.detail-label{width:40%;color:var(--ts-muted);font-size:.88rem;}
.detail-value{flex:1;font-weight:500;font-size:.88rem;}
#filePreviewModal .modal-content{background:var(--ts-surface);color:var(--ts-text);border:1px solid var(--ts-border);}
#filePreviewModal .modal-header,#filePreviewModal .modal-footer{border-color:var(--ts-border);}
.preview-frame{width:100%;height:80vh;border:0;background:#fff;}
.preview-image{max-width:100%;max-height:80vh;display:block;margin:auto;background:#000;}
.preview-text{white-space:pre-wrap;padding:1.5rem;font-family:monospace;font-size:.85rem;max-height:80vh;overflow:auto;background:var(--ts-surface);color:var(--ts-text);}
.emergency-btn{background:transparent;border:1px dashed var(--ts-border);color:var(--ts-muted);font-size:.8rem;padding:.4rem .8rem;border-radius:8px;transition:all .15s;}
.emergency-btn:hover{border-color:#f87171;color:#f87171;background:rgba(248,113,113,.08);}
.form-switch .form-check-input{background-color:rgba(255,255,255,.1);border-color:var(--ts-border);}
.form-switch .form-check-input:checked{background-color:var(--ts-primary);border-color:var(--ts-primary);}
.sync-box{background:linear-gradient(135deg,rgba(124,92,255,.08),rgba(167,139,250,.05));border:1px solid var(--ts-primary);border-radius:14px;padding:1.25rem;}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg ts-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#" onclick="App.go('home'); return false;">
      <span class="brand-mark"><i class="bi bi-shield-fill"></i></span>
      <span class="fw-semibold">TEAM <strong class="text-primary">SHADOW</strong></span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="navLinks"></ul>
    </div>
  </div>
</nav>

<div id="app"></div>

<footer class="border-top py-4 mt-5" style="border-color:var(--ts-border)!important;">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="small" style="color:var(--ts-muted);">© <span id="year"></span> Team Shadow · Founded by <strong>Moin Uddin</strong></div>
    <div class="small" style="color:var(--ts-muted);">Find Problems. Build Solutions. Create Something Meaningful.</div>
  </div>
</footer>

<div class="modal fade" id="filePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="filePreviewTitle">Preview</h5>
        <div class="ms-auto d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" id="filePreviewDownload"><i class="bi bi-download"></i> Download</button>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
      </div>
      <div class="modal-body p-0" id="filePreviewBody" style="min-height:70vh;"></div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const APP_VERSION = 'v6.0';
const FOUNDER_CODE = 'MOIN-SHADOW-2026';
const SECTORS = ['AI & Software','Cybersecurity','Healthcare','Biotechnology','Agriculture','Energy','Climate & Environment','Water & Waste','Finance / FinTech','Business','Education','Manufacturing','Robotics','Logistics','Transportation','Daily-Life Problems','Other'];
const WORK_TYPES = {problem_discovery:'Problem Discovery',problem_research:'Problem Research',market_research:'Market Research',customer_research:'Customer Research',competitor_research:'Competitor Research',solution_research:'Solution Research',validation:'Validation',experiment:'Experiment',project_update:'Project Update',other:'Other'};
const MAX_FILE_SIZE = 2*1024*1024, MAX_AVATAR_SIZE = 5*1024*1024;
const ALLOWED_TYPES = ['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','text/plain','image/jpeg','image/png','image/webp','image/gif'];

const DB = {
  read(k,d=[]){try{const v=localStorage.getItem('ts_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  write(k,v){try{localStorage.setItem('ts_'+k,JSON.stringify(v));return true}catch(e){if(String(e).includes('Quota')||String(e).includes('exceeded'))App.toast('Storage full. Delete some files.','danger');else App.toast('Could not save.','danger');return false}},
  nextId(k){const i=this.read(k,[]);return i.length?Math.max(...i.map(x=>Number(x.id)||0))+1:1}
};

const Utils = {
  fmtBytes(b){if(!b)return '0 B';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB'},
  readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(f)})},
  async compressImage(file,maxSize=320,quality=0.82){const d=await this.readAsDataURL(file);return new Promise(resolve=>{const img=new Image();img.onload=()=>{let{width,height}=img;if(width>height){if(width>maxSize){height*=maxSize/width;width=maxSize}}else{if(height>maxSize){width*=maxSize/height;height=maxSize}}const c=document.createElement('canvas');c.width=Math.round(width);c.height=Math.round(height);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=()=>resolve(d);img.src=d})},
  fileIcon(t,n=''){const s=(t||'')+' '+(n||'').toLowerCase();if(s.includes('pdf'))return 'bi-file-earmark-pdf text-danger';if(s.startsWith('image')||/\.(jpe?g|png|webp|gif)$/i.test(n))return 'bi-file-earmark-image text-info';if(s.includes('word')||/\.docx?$/i.test(n))return 'bi-file-earmark-word text-primary';if(s.includes('sheet')||s.includes('excel')||/\.xlsx?$/i.test(n))return 'bi-file-earmark-spreadsheet text-success';if(s.includes('presentation')||s.includes('powerpoint')||/\.pptx?$/i.test(n))return 'bi-file-earmark-slides text-warning';if(s==='text/plain'||/\.txt$/i.test(n))return 'bi-file-earmark-text';return 'bi-file-earmark'},
  isPDF(f){return (f.type||'').includes('pdf')||/\.pdf$/i.test(f.name||'')},
  isImage(f){return (f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif)$/i.test(f.name||'')},
  escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
};

const App = {
  currentUser:null, currentRoute:'', _pendingAvatar:null, _pendingFiles:[],

  init(){
    localStorage.setItem('ts_version', APP_VERSION);
    const uid = parseInt(localStorage.getItem('ts_session')||'0');
    if(uid){const u=DB.read('users',[]).find(x=>Number(x.id)===uid);if(u&&u.status==='active')this.currentUser=u;else localStorage.removeItem('ts_session')}
    document.getElementById('year').textContent = new Date().getFullYear();
    window.addEventListener('hashchange',()=>this.route());
    this.route();
  },

  route(){
    const hash = location.hash.slice(1)||'';
    const [route,...params] = hash.split('/');
    this.currentRoute = route||'home';
    this._pendingAvatar=null; this._pendingFiles=[];
    this.renderNav();
    try{
      switch(this.currentRoute){
        case '': case 'home': this.pageHome(); break;
        case 'login': this.pageLogin(); break;
        case 'register': this.pageRegister(); break;
        case 'logout': this.logout(); break;
        case 'dashboard': this.pageDashboard(); break;
        case 'my-submissions': this.pageMySubmissions(params[0]||'all'); break;
        case 'new-submission': this.pageSubmissionForm(null); break;
        case 'edit-submission': this.pageSubmissionForm(parseInt(params[0])); break;
        case 'view-submission': this.pageViewSubmission(parseInt(params[0])); break;
        case 'profile': this.pageProfileView(); break;
        case 'edit-profile': this.pageProfileEdit(); break;
        case 'members': this.pageMembers(); break;
        case 'member-view': this.pageMemberView(parseInt(params[0])); break;
        case 'notifications': this.pageNotifications(); break;
        case 'admin': this.pageAdmin(); break;
        case 'admin-members': this.pageAdminMembers(params[0]||'all'); break;
        case 'admin-submissions': this.pageAdminSubmissions(params[0]||'all'); break;
        case 'admin-activity': this.pageAdminActivity(); break;
        case 'sync': this.pageSync(); break;
        default: this.page404();
      }
    }catch(e){console.error('Route error:',e);this.toast('Something went wrong.','danger');this.go('home')}
    window.scrollTo(0,0);
  },

  go(path){ location.hash = path; },

  logout(){
    if(this.currentUser) this.log('logout',`User logged out: ${this.currentUser.email}`);
    localStorage.removeItem('ts_session');
    this.currentUser = null;
    this.toast('Logged out successfully.','info');
    this.go('login');
  },

  renderNav(){
    const el = document.getElementById('navLinks');
    if(!el) return;
    const u = this.currentUser;
    if(u){
      const isFounder = u.role === 'founder';
      const dashRoute = isFounder ? 'admin' : 'dashboard';
      el.innerHTML = `
        <li class="nav-item"><a class="nav-link fw-semibold ${this.currentRoute===dashRoute?'text-primary':''}" href="#${dashRoute}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
        ${!isFounder?`<li class="nav-item"><a class="nav-link" href="#new-submission"><i class="bi bi-plus-lg"></i> New</a></li>`:''}
        <li class="nav-item"><a class="nav-link" href="#members"><i class="bi bi-people"></i> Members</a></li>
        <li class="nav-item"><a class="nav-link position-relative" href="#notifications"><i class="bi bi-bell${this.unreadCount()?'-fill':''}"></i>${this.unreadCount()?`<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:.6rem;">${this.unreadCount()}</span>`:''}</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="App.toggleTheme();return false;"><i class="bi bi-moon-stars"></i></a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" data-bs-toggle="dropdown">
            ${this.avatarHtml(u,'avatar-sm')}<span>${this.esc(u.full_name.split(' ')[0])}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#profile"><i class="bi bi-person-circle me-2"></i> My Profile</a></li>
            <li><a class="dropdown-item" href="#edit-profile"><i class="bi bi-pencil me-2"></i> Edit Profile</a></li>
            <li><a class="dropdown-item" href="#sync"><i class="bi bi-arrow-left-right me-2"></i> Sync Data</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#logout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
          </ul>
        </li>`;
    }else{
      el.innerHTML = `
        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="App.toggleTheme();return false;"><i class="bi bi-moon-stars"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="#login">Login</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm px-3" href="#register">Join</a></li>`;
    }
  },

  toggleTheme(){const c=document.documentElement.getAttribute('data-bs-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-bs-theme',n);localStorage.setItem('ts_theme',n)},
  esc(s){return Utils.escape(s)},
  now(){return new Date().toISOString()},
  ago(t){if(!t)return '—';const d=(Date.now()-new Date(t).getTime())/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';if(d<2592000)return Math.floor(d/86400)+'d ago';return new Date(t).toLocaleDateString()},
  fmt(t){return t?new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—'},
  avatarHtml(user,sizeClass='avatar-md'){
    if(user&&user.avatar)return `<img src="${user.avatar}" class="${sizeClass}" alt="">`;
    const initial = (user?.full_name||'?').charAt(0).toUpperCase();
    const px = sizeClass==='avatar-sm'?'36px':sizeClass==='avatar-lg'?'120px':'56px';
    const fs = sizeClass==='avatar-sm'?'.9rem':sizeClass==='avatar-lg'?'3rem':'1.3rem';
    return `<span class="${sizeClass} avatar-fallback" style="font-size:${fs};width:${px};height:${px};">${initial}</span>`;
  },
  toast(msg,variant='info',duration=4200){
    const stack = document.getElementById('toastStack'); if(!stack) return;
    const icons = {success:'bi-check-circle-fill',danger:'bi-exclamation-octagon-fill',warning:'bi-exclamation-triangle-fill',info:'bi-info-circle-fill'};
    const el = document.createElement('div');
    el.className = `ts-toast ${variant}`;
    el.innerHTML = `<i class="bi ${icons[variant]||icons.info} fs-5"></i><div class="flex-grow-1">${this.esc(msg)}</div>`;
    stack.appendChild(el);
    setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-10px)';setTimeout(()=>el.remove(),200)},duration);
  },
  log(action,description){const logs=DB.read('activity',[]);logs.unshift({id:DB.nextId('activity'),user_id:this.currentUser?.id||null,user_name:this.currentUser?.full_name||'Guest',action,description,created_at:this.now()});DB.write('activity',logs.slice(0,500))},

  exportData(){
    const data = {
      version: APP_VERSION,
      exported_at: this.now(),
      users: DB.read('users',[]),
      submissions: DB.read('submissions',[]),
      versions: DB.read('versions',[]),
      notifications: DB.read('notifications',[]),
      activity: DB.read('activity',[])
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'team-shadow-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    this.toast('✓ Backup downloaded. Isko phone me import karo.','success',6000);
  },

  handleImportPick(input){
    const file = input.files[0];
    if(!file) return;
    const preview = document.getElementById('importPreview');
    preview.innerHTML = '<p class="small" style="color:var(--ts-muted);">Reading file…</p>';
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const counts = {
          users: (data.users||[]).length,
          submissions: (data.submissions||[]).length,
          versions: (data.versions||[]).length,
          notifications: (data.notifications||[]).length
        };
        preview.innerHTML = `
          <div class="alert alert-info small mb-2">
            <strong>File contents:</strong><br>
            • Users: ${counts.users}<br>
            • Submissions: ${counts.submissions}<br>
            • Versions: ${counts.versions}<br>
            • Notifications: ${counts.notifications}
          </div>
          <button class="btn btn-success" onclick='App.applyImport(${JSON.stringify(JSON.stringify(data))})'>
            <i class="bi bi-upload"></i> Confirm & Replace My Data
          </button>
        `;
      } catch(err) {
        preview.innerHTML = '<div class="alert alert-danger small">❌ Invalid JSON file.</div>';
      }
    };
    reader.readAsText(file);
  },

  applyImport(jsonStr){
    try {
      const data = JSON.parse(jsonStr);
      if(!data.users || !Array.isArray(data.users)) return this.toast('Invalid backup file.','danger');
      if(!confirm('⚠️ Ye aapka current data REPLACE kar dega. Continue?')) return;

      DB.write('users', data.users||[]);
      DB.write('submissions', data.submissions||[]);
      DB.write('versions', data.versions||[]);
      DB.write('notifications', data.notifications||[]);
      DB.write('activity', data.activity||[]);

      // Session restore — find current user by email if exists
      const currentEmail = this.currentUser?.email;
      if(currentEmail){
        const me = data.users.find(u => String(u.email).toLowerCase() === String(currentEmail).toLowerCase());
        if(me){ localStorage.setItem('ts_session', String(me.id)); this.currentUser = me; }
        else localStorage.removeItem('ts_session');
      }

      this.toast('✓ Data imported successfully!','success',5000);
      setTimeout(()=>location.reload(), 1500);
    } catch(e) { this.toast('Import failed: ' + e.message,'danger'); }
  },

  wipeAll(){
    if(!confirm('⚠️ Ye SAARA data delete kar dega. Sure?')) return;
    if(!confirm('🚨 Final warning — undo nahi hoga.')) return;
    localStorage.clear();
    this.toast('✓ All data wiped.','success');
    setTimeout(()=>location.reload(), 1000);
  },

  doRegister(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = (fd.get('full_name')||'').trim();
    const email = (fd.get('email')||'').trim().toLowerCase();
    const pass = (fd.get('password')||'').trim();
    const confirm = (fd.get('password_confirm')||'').trim();
    const founderCode = (fd.get('founder_code')||'').trim();
    if(!name||name.length<3) return this.toast('Full name must be at least 3 characters.','danger');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return this.toast('Valid email required.','danger');
    if(pass.length<8) return this.toast('Password must be at least 8 characters.','danger');
    if(pass!==confirm) return this.toast('Passwords do not match.','danger');
    const users = DB.read('users',[]);
    if(users.some(u=>String(u.email).toLowerCase()===email)) return this.toast('Email already registered.','danger');
    const isFounder = founderCode === FOUNDER_CODE;
    const newUser = {
      id: DB.nextId('users'),
      full_name: name, email, password: pass,
      gender: fd.get('gender')||'prefer_not_to_say',
      age: parseInt(fd.get('age'))||null,
      sector: fd.get('sector')||'',
      bio: (fd.get('bio')||'').trim(),
      avatar: this._pendingAvatar||null,
      role: isFounder?'founder':'member',
      status: isFounder?'active':'pending',
      created_at: this.now(), last_login: null
    };
    users.push(newUser);
    if(!DB.write('users',users)) return;
    this.log('signup',`New ${newUser.role} registered: ${email}`);
    if(isFounder) this.toast('✓ Founder account created! Login now.','success');
    else{this.notifyFounders('New member request',`${name} (${email}) requested access.`,'admin-members');this.toast('Account created. Waiting for founder approval.','info')}
    this.go('login');
  },

  doLogin(e){
    e.preventDefault();
    const form = e.target;

    this.currentUser = user;
    this.log('login',`User logged in: ${email}`);

  showRecovery(){
    const users = DB.read('users',[]);
    const list = users.length?users.map(u=>`• ${u.full_name} (${u.email}) — ${u.role}, ${u.status}`).join('\n'):'(No accounts registered)';
    const choice = prompt('🔑 RECOVERY\n\n📋 Registered accounts:\n'+list+'\n\nType one:\n  LIST → Show all accounts\n  RESET → ⚠️ WIPE all data\n  CHANGE → Change a password\n  CANCEL → Close\n\nEnter choice:');
    if(choice===null)return;
    const c = choice.trim().toUpperCase();
    if(c==='LIST'){alert('📋 All accounts:\n\n'+list);return}
    if(c==='RESET'){if(!confirm('⚠️ DELETE everything?'))return;if(!confirm('🚨 Final warning.'))return;localStorage.clear();this.toast('✓ Data wiped.','success');setTimeout(()=>location.reload(),1000);return}
    if(c==='CHANGE'){
      const targetEmail = prompt('Enter EMAIL:');
      if(!targetEmail)return;
      const idx = users.findIndex(u=>String(u.email).trim().toLowerCase()===targetEmail.trim().toLowerCase());
      if(idx===-1)return alert('❌ No account found.');
      const newPass = prompt('New password (min 8):');
      if(!newPass||newPass.trim().length<8)return alert('❌ 8+ chars.');
      users[idx].password = newPass.trim();
      DB.write('users',users);
      alert(`✓ Updated!\nEmail: ${users[idx].email}\nNew password: ${users[idx].password}`);
      return;
    }
  },

  async handleFilesPick(input){
    const files = Array.from(input.files||[]);
    for(const f of files){
      if(f.size>MAX_FILE_SIZE){this.toast(`"${f.name}" too big (max 2 MB).`,'danger');continue}
      const ok = ALLOWED_TYPES.includes(f.type) || /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|jpe?g|png|webp|gif)$/i.test(f.name);
      if(!ok){this.toast(`File type not allowed: ${f.name}`,'danger');continue}
      try{const data=await Utils.readAsDataURL(f);this._pendingFiles.push({name:f.name,type:f.type||'application/octet-stream',size:f.size,data})}catch(e){this.toast(`Could not read ${f.name}`,'danger')}
    }
    input.value=''; this.renderPendingFiles();
  },

  renderPendingFiles(){
    const el = document.getElementById('fileList'); if(!el) return;
    if(!this._pendingFiles.length){el.innerHTML='';return}
    el.innerHTML = this._pendingFiles.map((f,i)=>`
      <div class="file-preview">
        <i class="bi ${Utils.fileIcon(f.type,f.name)} file-ic"></i>
        <div class="file-info"><div class="file-name">${this.esc(f.name)}</div><div class="file-meta">${Utils.fmtBytes(f.size)}</div></div>
        <div class="file-actions">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="App.previewData(${i})"><i class="bi bi-eye"></i></button>
          <button type="button" class="btn btn-sm btn-outline-danger" onclick="App.removeFile(${i})"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
    `).join('');
  },

  previewData(i){const f=this._pendingFiles[i];if(!f)return;this.openPreview(f.name,f.type,f.data)},
  removeFile(i){if(!confirm('Remove this file?'))return;this._pendingFiles.splice(i,1);this.renderPendingFiles()},

  saveSubmission(e, editId){
    e.preventDefault();
    const u = this.currentUser;
    const fd = new FormData(e.target);
    const data = {title:(fd.get('title')||'').trim(),work_type:fd.get('work_type')||'',sector:fd.get('sector')||'',problem:(fd.get('problem')||'').trim(),research:(fd.get('research')||'').trim(),findings:(fd.get('findings')||'').trim(),solution:(fd.get('solution')||'').trim()};
    if(!data.title||!data.work_type||!data.problem) return this.toast('Title, type and problem are required.','danger');
    const subs = DB.read('submissions',[]);
    const versions = DB.read('versions',[]);
    const action = e.submitter?.value || 'save';
    let id;
    if(editId){
      const idx = subs.findIndex(s=>Number(s.id)===editId);
      subs[idx] = {...subs[idx],...data,attachments:this._pendingFiles,updated_at:this.now()};
      id = editId;
      if(action==='submit'){ subs[idx].status='submitted'; subs[idx].submitted_at=this.now(); subs[idx].edit_permission=false; }
    } else {
      id = DB.nextId('submissions');
      subs.push({id,user_id:u.id,...data,attachments:this._pendingFiles,status:action==='submit'?'submitted':'draft',edit_permission:false,created_at:this.now(),updated_at:this.now(),submitted_at:action==='submit'?this.now():null});
    }
    if(!DB.write('submissions',subs)) return;
    const saved = subs.find(s=>Number(s.id)===id);
    const vnum = versions.filter(v=>Number(v.submission_id)===id).length+1;
    versions.unshift({id:DB.nextId('versions'),submission_id:id,version:vnum,snapshot:JSON.stringify({...saved,attachments:saved.attachments?.map(a=>({name:a.name,type:a.type,size:a.size}))}),changed_by:u.id,change_type:editId?'update':'create',created_at:this.now()});
    DB.write('versions',versions);
    if(action==='submit'){
      this.log('submission.submit',`Submitted for review: ${data.title}`);
      this.notifyFounders('New submission for review',`${u.full_name} submitted: "${data.title}"`,`view-submission/${id}`);
      this.toast('✓ Submission sent for review.','success');
      return this.go('view-submission/'+id);
    }
    this.log(editId?'submission.update':'submission.create',data.title);
    this.toast('✓ Draft saved.','success');
    this.go('view-submission/'+id);
  },

      `:isOwner?`
        <div class="alert alert-warning small"><i class="bi bi-lock-fill"></i> This submission is <strong>${sub.status}</strong>. <strong>You can't edit or delete without Founder permission.</strong></div>

      <div class="row g-4">

  toggleEditPermission(subId, granted){
    if(!this.requireFounder()) return;
    const subs = DB.read('submissions',[]);
    const idx = subs.findIndex(s=>Number(s.id)===Number(subId));
    if(idx===-1) return;
    subs[idx].edit_permission = granted ? true : false;
    subs[idx].updated_at = this.now();
    DB.write('submissions', subs);
    const sub = subs[idx];
    this.log('permission.change', `${granted?'Granted':'Revoked'} edit permission for "${sub.title}"`);
    this.notify(Number(sub.user_id),
      granted ? '✓ Edit permission granted' : 'Edit permission revoked',
      granted ? `Founder granted you permission to edit "${sub.title}".` : `Founder revoked your edit permission for "${sub.title}".`,
      `view-submission/${subId}`);
    this.toast(granted?'✓ Edit permission granted.':'Edit permission revoked.','success');
  },

  downloadFile(subId,fileIdx){
    const sub = DB.read('submissions',[]).find(s=>Number(s.id)===subId);
    if(!sub?.attachments?.[fileIdx]) return this.toast('File not found.','danger');
    const f = sub.attachments[fileIdx];
    const a = document.createElement('a'); a.href = f.data; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    this.toast(`Downloading ${f.name}`,'success');
  },

  previewAttachment(subId,fileIdx){
    const sub = DB.read('submissions',[]).find(s=>Number(s.id)===subId);
    if(!sub?.attachments?.[fileIdx]) return;
    const f = sub.attachments[fileIdx];
    this.openPreview(f.name,f.type,f.data);
  },

  openPreview(name,type,dataUrl){
    const modalEl = document.getElementById('filePreviewModal');
    document.getElementById('filePreviewTitle').textContent = name;
    const body = document.getElementById('filePreviewBody');
    document.getElementById('filePreviewDownload').onclick = ()=>{const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()};
    if(Utils.isPDF({type,name})) body.innerHTML = `<iframe class="preview-frame" src="${dataUrl}"></iframe>`;
    else if(Utils.isImage({type,name})) body.innerHTML = `<img src="${dataUrl}" class="preview-image">`;
    else if((type||'').includes('text')||/\.txt$/i.test(name)){
      try{const b64=dataUrl.split(',')[1];const text=decodeURIComponent(escape(atob(b64)));body.innerHTML=`<div class="preview-text">${this.esc(text)}</div>`}catch{body.innerHTML=`<div class="p-4">Cannot decode.</div>`}
    } else body.innerHTML = `<div class="p-4 text-center"><i class="bi bi-file-earmark fs-1" style="color:var(--ts-muted);"></i><p class="mt-3 mb-0" style="color:var(--ts-muted);">Preview not available.</p></div>`;
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
  },

  deleteAttachment(subId,fileIdx){
    const subs = DB.read('submissions',[]);
    const idx = subs.findIndex(s=>Number(s.id)===Number(subId));
    if(idx===-1) return;
    const sub = subs[idx];
    const isOwner = Number(sub.user_id)===Number(this.currentUser.id);
    const isFounder = this.currentUser.role==='founder';
    if(!isOwner && !isFounder) return this.toast('Not allowed.','danger');
    if(isOwner && sub.status!=='draft' && !sub.edit_permission) return this.toast('Cannot delete — locked.','danger');
    const f = sub.attachments[fileIdx]; if(!f) return;
    if(!confirm(`Delete "${f.name}"?`)) return;
    sub.attachments.splice(fileIdx,1);
    sub.updated_at = this.now();
    DB.write('submissions',subs);
    this.log('attachment.delete',`${sub.title} — ${f.name}`);
    this.toast('✓ Deleted.','success');
    this.pageViewSubmission(subId);
  },

  founderSubmissionAction(id,action){
    if(!this.requireFounder()) return;
    const subs = DB.read('submissions',[]);
    const idx = subs.findIndex(s=>Number(s.id)===Number(id));
    if(idx===-1) return;
    const sub = subs[idx];
    const newStatus = {approve:'approved',archive:'archived',restore:'approved'}[action];
    if(!newStatus) return;
    subs[idx].status = newStatus;
    subs[idx].updated_at = this.now();
    DB.write('submissions',subs);
    const versions = DB.read('versions',[]);
    const vnum = versions.filter(v=>Number(v.submission_id)===Number(id)).length+1;
    versions.unshift({id:DB.nextId('versions'),submission_id:id,version:vnum,snapshot:JSON.stringify({...subs[idx],attachments:subs[idx].attachments?.map(a=>({name:a.name,type:a.type,size:a.size}))}),changed_by:this.currentUser.id,change_type:action,created_at:this.now()});
    DB.write('versions',versions);
    this.log(`submission.${action}`,sub.title);
    this.notify(Number(sub.user_id),`Submission ${action}d`,`Your submission "${sub.title}" was ${action}d.`,`view-submission/${id}`);
    this.toast(`✓ Submission ${action}d.`,'success');
    this.pageViewSubmission(id);
  },

  pageProfileView(){

  async handleAvatarPickEdit(input){
    const file = input.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')) return this.toast('Please pick an image.','danger');
    if(file.size>MAX_AVATAR_SIZE) return this.toast('Max 5 MB.','danger');
    this.toast('Processing…','info',1500);
    try{const c=await Utils.compressImage(file,320,0.82);this._pendingAvatar=c;document.getElementById('avatarPreviewEdit').innerHTML=`<img src="${c}" class="avatar-lg">`}catch(e){this.toast('Failed.','danger')}
  },

  removeAvatar(){this._pendingAvatar=null;document.getElementById('avatarPreviewEdit').innerHTML=this.avatarHtml(this.currentUser,'avatar-lg');this.toast('Will be removed.','info')},

  saveProfile(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const users = DB.read('users',[]);
    const idx = users.findIndex(u=>Number(u.id)===Number(this.currentUser.id));
    users[idx].full_name = (fd.get('full_name')||'').trim();
    users[idx].gender = fd.get('gender');
    users[idx].age = parseInt(fd.get('age'))||null;
    users[idx].sector = fd.get('sector')||'';
    users[idx].bio = (fd.get('bio')||'').trim();
    users[idx].avatar = this._pendingAvatar;
    if(!DB.write('users',users)) return;
    this.currentUser = users[idx];
    this.log('profile.update','Profile updated');
    this.toast('✓ Saved.','success');
    this.go('profile');
  },

        </div>
        <div class="mb-3 d-flex gap-2 flex-wrap">
          <a href="#admin-members/all" class="btn btn-sm ${filter==='all'?'btn-primary':'btn-outline-secondary'}">All (${allCounts.all})</a>
          <a href="#admin-members/pending" class="btn btn-sm ${filter==='pending'?'btn-warning':'btn-outline-secondary'}">Pending (${allCounts.pending})</a>
          <a href="#admin-members/active" class="btn btn-sm ${filter==='active'?'btn-success':'btn-outline-secondary'}">Active (${allCounts.active})</a>
          <a href="#admin-members/suspended" class="btn btn-sm ${filter==='suspended'?'btn-danger':'btn-outline-secondary'}">Suspended (${allCounts.suspended})</a>
          <a href="#admin-members/deactivated" class="btn btn-sm ${filter==='deactivated'?'btn-secondary':'btn-outline-secondary'}">Deactivated (${allCounts.deactivated})</a>
        </div>
        <div class="card"><div class="card-body p-0">
          ${members.length?`<div class="table-responsive"><table class="table align-middle mb-0" style="color:inherit;">
            <thead><tr><th></th><th>Name</th><th>Email</th><th>Sector</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody>${members.map(m=>`<tr>
              <td>${this.avatarHtml(m,'avatar-sm')}</td>
              <td><strong>${this.esc(m.full_name)}</strong></td>
              <td class="small">${this.esc(m.email)}</td>
              <td class="small">${this.esc(m.sector||'—')}</td>
              <td><span class="badge-status status-${m.status}">${m.status}</span></td>
              <td class="text-end">
                ${m.status==='pending'?`<button class="btn btn-success btn-sm py-0 px-2" onclick="App.memberAction(${m.id},'approve')">Approve</button>`:''}
                ${m.status==='active'?`<button class="btn btn-warning btn-sm py-0 px-2" onclick="App.memberAction(${m.id},'suspend')">Suspend</button>`:''}
                ${m.status==='suspended'?`<button class="btn btn-success btn-sm py-0 px-2" onclick="App.memberAction(${m.id},'reactivate')">Reactivate</button>`:''}
                ${m.status!=='deactivated'?`<button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="App.memberAction(${m.id},'deactivate')">Deactivate</button>`:''}
                <a href="#member-view/${m.id}" class="btn btn-sm btn-outline-secondary py-0 px-2">View</a>
              </td>
            </tr>`).join('')}</tbody>
          </table></div>`:`<div class="empty-state"><i class="bi bi-people"></i><h6>No members with this status</h6></div>`}
        </div></div>
      </div>
    </div></div>`;
  },

  memberAction(id,action){
    if(!this.requireFounder()) return;
    const users = DB.read('users',[]);
    const u = users.find(x=>Number(x.id)===Number(id));
    if(!u) return;
    const newStatus = {approve:'active',suspend:'suspended',reactivate:'active',deactivate:'deactivated'}[action];
    if(!newStatus) return;
    u.status = newStatus;
    DB.write('users',users);
    this.log(`member.${action}`,`${u.full_name}`);
    this.notify(Number(id),`Account ${action}d`,`Your account status: ${newStatus}`,null);
    this.toast(`✓ Member ${action}d.`,'success');
    this.pageAdminMembers(this.currentRoute.split('/')[1] || 'all');
  },

  /* ===== ADMIN SUBMISSIONS (with filter param) ===== */
  pageAdminSubmissions(filter='all'){
    if(!this.requireFounder()) return;
    let subs = DB.read('submissions',[]);
    const users = DB.read('users',[]);
    const counts = {
      all: subs.length,
      awaiting: subs.filter(s=>['submitted','under_review'].includes(s.status)).length,
      approved: subs.filter(s=>s.status==='approved').length,
      draft: subs.filter(s=>s.status==='draft').length,
      archived: subs.filter(s=>s.status==='archived').length
    };
    if(filter==='awaiting') subs = subs.filter(s=>['submitted','under_review'].includes(s.status));
    else if(filter==='approved') subs = subs.filter(s=>s.status==='approved');
    else if(filter==='draft') subs = subs.filter(s=>s.status==='draft');
    else if(filter==='archived') subs = subs.filter(s=>s.status==='archived');

    document.getElementById('app').innerHTML = `
    <div class="container-fluid py-4 px-lg-5"><div class="row g-0">
      <div class="col-lg-3 col-xl-2">${this.sidebar('admin-submissions')}</div>
      <div class="col-lg-9 col-xl-10 ps-lg-4 py-3">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <h3 class="mb-0">All Submissions <span class="badge bg-secondary">${subs.length}</span></h3>
          <a href="#admin" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
        </div>
        <div class="mb-3 d-flex gap-2 flex-wrap">
          <a href="#admin-submissions/all" class="btn btn-sm ${filter==='all'?'btn-primary':'btn-outline-secondary'}">All (${counts.all})</a>
          <a href="#admin-submissions/awaiting" class="btn btn-sm ${filter==='awaiting'?'btn-info':'btn-outline-secondary'}">Awaiting Review (${counts.awaiting})</a>
          <a href="#admin-submissions/approved" class="btn btn-sm ${filter==='approved'?'btn-success':'btn-outline-secondary'}">Approved (${counts.approved})</a>
          <a href="#admin-submissions/draft" class="btn btn-sm ${filter==='draft'?'btn-warning':'btn-outline-secondary'}">Drafts (${counts.draft})</a>
          <a href="#admin-submissions/archived" class="btn btn-sm ${filter==='archived'?'btn-secondary':'btn-outline-secondary'}">Archived (${counts.archived})</a>
        </div>
        <div class="card"><div class="card-body p-0">
          ${subs.length?`<div class="table-responsive"><table class="table align-middle mb-0" style="color:inherit;">
            <thead><tr><th>Title</th><th>Author</th><th>Type</th><th>Files</th><th>Edit Perm</th><th>Status</th><th></th></tr></thead>
            <tbody>${subs.map(s=>{
              const a = users.find(u=>Number(u.id)===Number(s.user_id));
              return `<tr>
                <td><strong>${this.esc(s.title)}</strong></td>
                <td class="small">${this.esc(a?.full_name||'—')}</td>
                <td class="small">${WORK_TYPES[s.work_type]||s.work_type}</td>
                <td class="small">${s.attachments?.length?`<i class="bi bi-paperclip"></i> ${s.attachments.length}`:'—'}</td>
                <td>${s.edit_permission?`<span class="badge bg-warning text-dark"><i class="bi bi-unlock-fill"></i> ON</span>`:`<span class="badge bg-secondary"><i class="bi bi-lock"></i> OFF</span>`}</td>
                <td><span class="badge-status status-${s.status}">${s.status}</span></td>
                <td class="text-end"><a href="#view-submission/${s.id}" class="btn btn-sm btn-outline-secondary py-0">View</a></td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>`:`<div class="empty-state"><i class="bi bi-journal-x"></i><h6>No submissions in this filter</h6></div>`}
        </div></div>
      </div>
    </div></div>`;
  },

  pageAdminActivity(){
    if(!this.requireFounder()) return;
    const activity = DB.read('activity',[]);
    document.getElementById('app').innerHTML = `
    <div class="container-fluid py-4 px-lg-5"><div class="row g-0">
      <div class="col-lg-3 col-xl-2">${this.sidebar('admin-activity')}</div>
      <div class="col-lg-9 col-xl-10 ps-lg-4 py-3">
        <h3 class="mb-4">Activity Log (${activity.length})</h3>
        <div class="card"><div class="card-body">
          ${activity.length?activity.map(a=>`<div class="activity-item">
            <span class="activity-dot"></span>
            <strong>${this.esc(a.user_name||'System')}</strong>
            <code class="small" style="background:rgba(124,92,255,.12);color:var(--ts-primary-2);padding:.1rem .4rem;border-radius:4px;">${a.action}</code>
            — ${this.esc(a.description||'')}
            <span class="small ms-2" style="color:var(--ts-muted);">${this.fmt(a.created_at)}</span>
          </div>`).join(''):`<div class="empty-state"><i class="bi bi-activity"></i><h6>No activity yet</h6></div>`}
        </div></div>
      </div>
    </div></div>`;
  },

  page404(){
    document.getElementById('app').innerHTML = `
    <div class="container py-5 text-center">
      <h1 class="display-1">404</h1>
      <p style="color:var(--ts-muted);">Page not found.</p>
      <a href="#home" class="btn btn-primary">Go Home</a>
    </div>`;
  }
};

document.addEventListener('DOMContentLoaded',()=>{
  const savedTheme = localStorage.getItem('ts_theme');
  if(savedTheme) document.documentElement.setAttribute('data-bs-theme', savedTheme);
  App.init();
});
</script>
</body>
</html>
