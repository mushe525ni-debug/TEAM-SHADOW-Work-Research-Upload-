<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Shadow — Find Problems. Build Solutions.</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--ts-primary:#7c5cff;--ts-primary-2:#a78bfa;--ts-bg:#0a0a12;--ts-surface:#11121c;--ts-border:#1d1f2e;--ts-muted:#8a8aa0;--ts-text:#e9e9f1;--ts-navbar:rgba(10,10,18,.85);}
[data-bs-theme="light"]{--ts-bg:#f7f7fb;--ts-surface:#fff;--ts-border:#e5e7ef;--ts-muted:#6b7280;--ts-text:#14141f;--ts-navbar:rgba(255,255,255,.92);}
body{background:var(--ts-bg);min-height:100vh;color:var(--ts-text);transition:background .3s;}
.hero{background:radial-gradient(circle at 30% 20%,rgba(124,92,255,.15),transparent 60%),radial-gradient(circle at 80% 80%,rgba(167,139,250,.1),transparent 55%);padding:60px 0;}
.text-primary{color:var(--ts-primary-2)!important;}
.btn-primary{background:var(--ts-primary);border-color:var(--ts-primary);color:#fff;}
.btn-primary:hover,.btn-primary:focus{background:#6d4cff;border-color:#6d4cff;color:#fff;}
.btn-primary:disabled{opacity:.6;}
.brand-mark{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,var(--ts-primary),var(--ts-primary-2));color:#fff;}
.card,.panel{background:var(--ts-surface);border:1px solid var(--ts-border);border-radius:14px;color:var(--ts-text);}
.stat-card{padding:1.1rem;transition:transform .15s,border-color .15s;cursor:pointer;position:relative;}
.stat-card:hover{transform:translateY(-3px);border-color:var(--ts-primary);box-shadow:0 8px 25px rgba(124,92,255,.15);}
.stat-card::after{content:'→';position:absolute;top:12px;right:14px;color:var(--ts-muted);opacity:.5;font-size:1rem;transition:all .2s;}
.stat-card:hover::after{opacity:1;color:var(--ts-primary-2);transform:translateX(4px);}
.stat-value{font-size:1.7rem;font-weight:700;line-height:1;}
.stat-label{color:var(--ts-muted);font-size:.82rem;margin-top:.35rem;}
.badge-status{font-size:.7rem;padding:.3rem .65rem;border-radius:100px;font-weight:600;display:inline-block;}
.status-draft{background:rgba(138,138,160,.15);color:var(--ts-muted);}
.status-submitted{background:rgba(34,211,238,.15);color:#22d3ee;}
.status-under_review{background:rgba(251,191,36,.15);color:#fbbf24;}
.status-approved{background:rgba(52,211,153,.15);color:#34d399;}
.status-archived{background:rgba(138,138,160,.15);color:#64748b;}
.status-pending{background:rgba(251,191,36,.15);color:#fbbf24;}
.status-active{background:rgba(52,211,153,.15);color:#34d399;}
.status-suspended{background:rgba(248,113,113,.15);color:#f87171;}
.status-deactivated{background:rgba(138,138,160,.15);color:#64748b;}
.role-founder{background:rgba(255,215,0,.15);color:#ffd700;}
.role-member{background:rgba(124,92,255,.15);color:var(--ts-primary-2);}
.role-pill{font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:100px;display:inline-block;}
.sidebar{background:var(--ts-surface);border-right:1px solid var(--ts-border);min-height:calc(100vh - 64px);padding:1rem .5rem;position:sticky;top:64px;}
.sidebar-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;border-radius:10px;color:var(--ts-muted);text-decoration:none;font-size:.9rem;transition:all .15s;margin-bottom:.15rem;cursor:pointer;}
.sidebar-link:hover{background:rgba(124,92,255,.08);color:var(--ts-text);}
.sidebar-link.active{background:rgba(124,92,255,.15);color:var(--ts-primary-2);font-weight:600;}
.sidebar-link i{font-size:1.05rem;width:20px;}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ts-muted);}
.empty-state i{font-size:2.5rem;opacity:.4;display:block;margin-bottom:.75rem;}
.form-control,.form-select{background:rgba(0,0,0,.2);border-color:var(--ts-border);color:inherit;}
[data-bs-theme="light"] .form-control,[data-bs-theme="light"] .form-select{background:#fbfbfe;color:#111;}
.form-control:focus,.form-select:focus{background:rgba(0,0,0,.3);border-color:var(--ts-primary);color:inherit;box-shadow:0 0 0 .2rem rgba(124,92,255,.15);}
[data-bs-theme="light"] .form-control:focus,[data-bs-theme="light"] .form-select:focus{background:#fff;color:#111;}
.toast-stack{position:fixed;top:1rem;right:1rem;z-index:3000;display:flex;flex-direction:column;gap:.5rem;max-width:400px;}
.ts-toast{padding:.85rem 1rem;border-radius:12px;background:var(--ts-surface);border:1px solid var(--ts-border);box-shadow:0 12px 40px rgba(0,0,0,.4);animation:toastIn .2s ease;display:flex;align-items:flex-start;gap:.75rem;font-size:.9rem;color:var(--ts-text);}
.ts-toast.success{border-color:rgba(52,211,153,.4);}.ts-toast.success i{color:#34d399;}
.ts-toast.danger{border-color:rgba(248,113,113,.4);}.ts-toast.danger i{color:#f87171;}
.ts-toast.info{border-color:rgba(34,211,238,.4);}.ts-toast.info i{color:#22d3ee;}
@keyframes toastIn{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.activity-item{padding:.55rem 0;border-bottom:1px solid var(--ts-border);font-size:.85rem;}
.activity-item:last-child{border-bottom:0;}
.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--ts-primary);display:inline-block;margin-right:.6rem;}
.version-item{padding:.6rem 0;border-bottom:1px solid var(--ts-border);font-size:.85rem;}
.version-item:last-child{border-bottom:0;}
.notif-item{padding:.75rem 1rem;border-bottom:1px solid var(--ts-border);display:flex;gap:.75rem;align-items:flex-start;}
.notif-item.unread{background:rgba(124,92,255,.05);}
.notif-item:last-child{border-bottom:0;}
.ts-navbar{background:var(--ts-navbar)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ts-border)!important;transition:background .3s;}
.ts-navbar .nav-link,.ts-navbar .navbar-brand{color:var(--ts-text)!important;}
.ts-navbar .nav-link:hover{color:var(--ts-primary-2)!important;}
.ts-navbar .dropdown-menu{background:var(--ts-surface);border:1px solid var(--ts-border);box-shadow:0 8px 30px rgba(0,0,0,.25);}
.ts-navbar .dropdown-item{color:var(--ts-text);}
.ts-navbar .dropdown-item:hover{background:rgba(124,92,255,.12);color:var(--ts-primary-2);}
.ts-navbar .dropdown-divider{border-color:var(--ts-border);}
[data-bs-theme="light"] .ts-navbar .navbar-toggler{border-color:#ccc;}
[data-bs-theme="light"] .ts-navbar .navbar-toggler-icon{filter:invert(0);}
.avatar-sm{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--ts-border);}
.avatar-md{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--ts-border);}
.avatar-lg{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--ts-primary);}
.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ts-primary),var(--ts-primary-2));color:#fff;font-weight:700;}
.file-drop{border:2px dashed var(--ts-border);border-radius:12px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .15s;background:rgba(124,92,255,.03);}
.file-drop:hover{border-color:var(--ts-primary);background:rgba(124,92,255,.08);}
.file-drop i{font-size:2rem;color:var(--ts-primary-2);}
.file-preview{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;background:rgba(124,92,255,.06);border:1px solid var(--ts-border);border-radius:10px;margin-bottom:.5rem;flex-wrap:wrap;}
.file-preview i.file-ic{font-size:1.5rem;color:var(--ts-primary-2);flex-shrink:0;}
.file-preview .file-info{flex-grow:1;min-width:0;}
.file-preview .file-name{font-weight:500;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-preview .file-meta{font-size:.72rem;color:var(--ts-muted);}
.file-preview .file-actions{display:flex;gap:.35rem;flex-wrap:wrap;}
.detail-row{display:flex;padding:.65rem 0;border-bottom:1px solid var(--ts-border);}
.detail-row:last-child{border-bottom:0;}
.detail-label{width:40%;color:var(--ts-muted);font-size:.88rem;}
.detail-value{flex:1;font-weight:500;font-size:.88rem;}
#filePreviewModal .modal-content{background:var(--ts-surface);color:var(--ts-text);border:1px solid var(--ts-border);}
#filePreviewModal .modal-header,#filePreviewModal .modal-footer{border-color:var(--ts-border);}
.preview-frame{width:100%;height:80vh;border:0;background:#fff;}
.preview-image{max-width:100%;max-height:80vh;display:block;margin:auto;background:#000;}
.preview-text{white-space:pre-wrap;padding:1.5rem;font-family:monospace;font-size:.85rem;max-height:80vh;overflow:auto;background:var(--ts-surface);color:var(--ts-text);}
.form-switch .form-check-input{background-color:rgba(255,255,255,.1);border-color:var(--ts-border);}
.form-switch .form-check-input:checked{background-color:var(--ts-primary);border-color:var(--ts-primary);}
#loadingOverlay{position:fixed;inset:0;background:var(--ts-bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:1rem;}
#loadingOverlay.hidden{display:none;}
.loader-ring{width:56px;height:56px;border:4px solid var(--ts-border);border-top-color:var(--ts-primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.cloud-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:100px;background:rgba(52,211,153,.15);color:#34d399;font-size:.7rem;font-weight:600;}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loader-ring"></div>
  <div style="color:var(--ts-muted);font-size:.9rem;">Connecting to Team Shadow cloud…</div>
</div>

<nav class="navbar navbar-expand-lg ts-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#" onclick="App.go('home'); return false;">
      <span class="brand-mark"><i class="bi bi-shield-fill"></i></span>
      <span class="fw-semibold">TEAM <strong class="text-primary">SHADOW</strong></span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="navLinks"></ul>
    </div>
  </div>
</nav>

<div id="app"></div>

<footer class="border-top py-4 mt-5" style="border-color:var(--ts-border)!important;">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="small" style="color:var(--ts-muted);">© <span id="year"></span> Team Shadow · Founded by <strong>Moin Uddin</strong></div>
    <div class="small" style="color:var(--ts-muted);">
      <span class="cloud-badge"><i class="bi bi-cloud-check-fill"></i> Cloud synced</span>
    </div>
  </div>
</footer>

<div class="modal fade" id="filePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="filePreviewTitle">Preview</h5>
        <div class="ms-auto d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" id="filePreviewDownload"><i class="bi bi-download"></i> Download</button>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
      </div>
      <div class="modal-body p-0" id="filePreviewBody" style="min-height:70vh;"></div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   Firebase Configuration — paste your own config here
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyArc1aFKbQ2POWEdYoxt_yvnq_vS4_Ep0U",
  authDomain: "team-shadow-95e94.firebaseapp.com",
  projectId: "team-shadow-95e94",
  storageBucket: "team-shadow-95e94.firebasestorage.app",
  messagingSenderId: "1057812105084",
  appId: "1:1057812105084:web:ca1fd83820c16bb8bb46f9"
};
/* ============================================================ */

const APP_VERSION = 'v7.0-cloud';
const FOUNDER_CODE = 'MOIN-SHADOW-2026';
const SECTORS = ['AI & Software','Cybersecurity','Healthcare','Biotechnology','Agriculture','Energy','Climate & Environment','Water & Waste','Finance / FinTech','Business','Education','Manufacturing','Robotics','Logistics','Transportation','Daily-Life Problems','Other'];
const WORK_TYPES = {problem_discovery:'Problem Discovery',problem_research:'Problem Research',market_research:'Market Research',customer_research:'Customer Research',competitor_research:'Competitor Research',solution_research:'Solution Research',validation:'Validation',experiment:'Experiment',project_update:'Project Update',other:'Other'};
const MAX_FILE_SIZE = 1.5*1024*1024, MAX_AVATAR_SIZE = 5*1024*1024;
const ALLOWED_TYPES = ['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint','application/vnd.openxmlformats-officedocument.presentationml.presentation','text/plain','image/jpeg','image/png','image/webp','image/gif'];

let fb = null, fsdb = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = firebase;
  fsdb = firebase.firestore();
  fsdb.settings({ merge: true });
} catch(e) {
  console.error('Firebase init error:', e);
}

const Cloud = {
  ready(){ return fsdb !== null && !FIREBASE_CONFIG.apiKey.includes('YOUR_') },
  async getUsers(){
    const s = await fsdb.collection('users').get();
    return s.docs.map(d => ({ ...d.data(), _docId: d.id }));
  },
  async getUserById(id){
    const d = await fsdb.collection('users').doc(String(id)).get();
    return d.exists ? { ...d.data(), _docId: d.id } : null;
  },
  async getUserByEmail(email){
    const s = await fsdb.collection('users').where('email','==',email.toLowerCase()).limit(1).get();
    if(s.empty) return null;
    const d = s.docs[0];
    return { ...d.data(), _docId: d.id };
  },
  async createUser(user){
    const ref = fsdb.collection('users').doc();
    await ref.set({ ...user, _id: ref.id, created_at: new Date().toISOString() });
    return ref.id;
  },
  async updateUser(docId, patch){
    await fsdb.collection('users').doc(docId).update(patch);
  },
  async getSubmissions(){
    const s = await fsdb.collection('submissions').orderBy('created_at','desc').get();
    return s.docs.map(d => ({ ...d.data(), _docId: d.id }));
  },
  async createSubmission(sub){
    const ref = fsdb.collection('submissions').doc();
    await ref.set({ ...sub, _id: ref.id, created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
    return ref.id;
  },
  async updateSubmission(docId, patch){
    await fsdb.collection('submissions').doc(docId).update({ ...patch, updated_at: new Date().toISOString() });
  },
  async getVersions(subId){
    const s = await fsdb.collection('versions').where('submission_id','==',subId).get();
    return s.docs.map(d => ({ ...d.data(), _docId: d.id })).sort((a,b)=>(b.version||0)-(a.version||0));
  },
  async addVersion(v){
    const ref = fsdb.collection('versions').doc();
    await ref.set({ ...v, _id: ref.id, created_at: new Date().toISOString() });
  },
  async getNotifications(userId){
    const s = await fsdb.collection('notifications').where('user_id','==',userId).get();
    return s.docs.map(d => ({ ...d.data(), _docId: d.id })).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  },
  async addNotification(n){
    const ref = fsdb.collection('notifications').doc();
    await ref.set({ ...n, _id: ref.id, is_read: false, created_at: new Date().toISOString() });
  },
  async updateNotification(docId, patch){
    await fsdb.collection('notifications').doc(docId).update(patch);
  },
  async getActivity(){
    const s = await fsdb.collection('activity').orderBy('created_at','desc').limit(500).get();
    return s.docs.map(d => ({ ...d.data(), _docId: d.id }));
  },
  async addActivity(a){
    const ref = fsdb.collection('activity').doc();
    await ref.set({ ...a, _id: ref.id, created_at: new Date().toISOString() });
  }
};

const Utils = {
  fmtBytes(b){if(!b)return '0 B';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB'},
  readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(f)})},
  async compressImage(file,maxSize=320,quality=0.82){const d=await this.readAsDataURL(file);return new Promise(resolve=>{const img=new Image();img.onload=()=>{let{width,height}=img;if(width>height){if(width>maxSize){height*=maxSize/width;width=maxSize}}else{if(height>maxSize){width*=maxSize/height;height=maxSize}}const c=document.createElement('canvas');c.width=Math.round(width);c.height=Math.round(height);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=()=>resolve(d);img.src=d})},
  fileIcon(t,n=''){const s=(t||'')+' '+(n||'').toLowerCase();if(s.includes('pdf'))return 'bi-file-earmark-pdf text-danger';if(s.startsWith('image')||/\.(jpe?g|png|webp|gif)$/i.test(n))return 'bi-file-earmark-image text-info';if(s.includes('word')||/\.docx?$/i.test(n))return 'bi-file-earmark-word text-primary';if(s.includes('sheet')||s.includes('excel')||/\.xlsx?$/i.test(n))return 'bi-file-earmark-spreadsheet text-success';if(s.includes('presentation')||s.includes('powerpoint')||/\.pptx?$/i.test(n))return 'bi-file-earmark-slides text-warning';if(s==='text/plain'||/\.txt$/i.test(n))return 'bi-file-earmark-text';return 'bi-file-earmark'},
  isPDF(f){return (f.type||'').includes('pdf')||/\.pdf$/i.test(f.name||'')},
  isImage(f){return (f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif)$/i.test(f.name||'')},
  escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
};

const App = {
  currentUser:null, currentRoute:'', _pendingAvatar:null, _pendingFiles:[],
  users:[], submissions:[], notifications:[], activity:[],

  async init(){
    if(!Cloud.ready()){
      document.getElementById('loadingOverlay').innerHTML = `
        <div class="card" style="max-width:600px;padding:2rem;">
          <h4 class="text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Firebase Config Missing</h4>
          <p class="mt-3">You haven't set your Firebase config. Paste your keys inside <code>FIREBASE_CONFIG</code> in the HTML file.</p>
          <p class="small" style="color:var(--ts-muted);">Setup takes about 5 minutes.</p>
        </div>`;
      return;
    }

    document.getElementById('year').textContent = new Date().getFullYear();

    try {
      await this.refreshAll();
      const sessionEmail = localStorage.getItem('ts_session_email');
      if(sessionEmail){
        const u = this.users.find(x => String(x.email).toLowerCase() === sessionEmail.toLowerCase());
        if(u && u.status === 'active') this.currentUser = u;
        else localStorage.removeItem('ts_session_email');
      }
    } catch(e){
      console.error('Initial load error:', e);
      this.toast('Cloud connection failed: ' + e.message, 'danger', 8000);
    }

    document.getElementById('loadingOverlay').classList.add('hidden');
    window.addEventListener('hashchange',()=>this.route());
    this.route();
  },

  async refreshAll(){
    try {
      [this.users, this.submissions, this.notifications, this.activity] = await Promise.all([
        Cloud.getUsers(),
        Cloud.getSubmissions(),
        this.currentUser ? Cloud.getNotifications(String(this.currentUser._docId)) : Promise.resolve([]),
        Cloud.getActivity()
      ]);
    } catch(e){ console.warn('refreshAll warn:', e); }
  },

  async refreshUser(){
    if(!this.currentUser) return;
    try {
      const fresh = await Cloud.getUserById(this.currentUser._docId);
      if(fresh) this.currentUser = fresh;
    } catch(e){}
  },

  route(){
    const hash = location.hash.slice(1)||'';
    const [route,...params] = hash.split('/');
    this.currentRoute = route||'home';
    this._pendingAvatar=null; this._pendingFiles=[];
    this.renderNav();
    try{
      switch(this.currentRoute){
        case '': case 'home': this.pageHome(); break;
        case 'login': this.pageLogin(); break;
        case 'register': this.pageRegister(); break;
        case 'logout': this.logout(); break;
        case 'dashboard': this.pageDashboard(); break;
        case 'my-submissions': this.pageMySubmissions(params[0]||'all'); break;
        case 'new-submission': this.pageSubmissionForm(null); break;
        case 'edit-submission': this.pageSubmissionForm(params[0]); break;
        case 'view-submission': this.pageViewSubmission(params[0]); break;
        case 'profile': this.pageProfileView(); break;
        case 'edit-profile': this.pageProfileEdit(); break;
        case 'members': this.pageMembers(); break;
        case 'member-view': this.pageMemberView(params[0]); break;
        case 'notifications': this.pageNotifications(); break;
        case 'admin': this.pageAdmin(); break;
        case 'admin-members': this.pageAdminMembers(params[0]||'all'); break;
        case 'admin-submissions': this.pageAdminSubmissions(params[0]||'all'); break;
        case 'admin-activity': this.pageAdminActivity(); break;
        default: this.page404();
      }
    }catch(e){console.error('Route error:',e);this.toast('Something went wrong.','danger')}
    window.scrollTo(0,0);
  },

  go(path){ location.hash = path; },

  async logout(){

  toggleTheme(){const c=document.documentElement.getAttribute('data-bs-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-bs-theme',n);localStorage.setItem('ts_theme',n)},
  esc(s){return Utils.escape(s)},
  now(){return new Date().toISOString()},
  ago(t){if(!t)return '—';const d=(Date.now()-new Date(t).getTime())/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';if(d<2592000)return Math.floor(d/86400)+'d ago';return new Date(t).toLocaleDateString()},
  fmt(t){return t?new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—'},
  avatarHtml(user,sizeClass='avatar-md'){
    if(user&&user.avatar)return `<img src="${user.avatar}" class="${sizeClass}" alt="">`;
    const initial = (user?.full_name||'?').charAt(0).toUpperCase();
    const px = sizeClass==='avatar-sm'?'36px':sizeClass==='avatar-lg'?'120px':'56px';
    const fs = sizeClass==='avatar-sm'?'.9rem':sizeClass==='avatar-lg'?'3rem':'1.3rem';
    return `<span class="${sizeClass} avatar-fallback" style="font-size:${fs};width:${px};height:${px};">${initial}</span>`;
  },
  toast(msg,variant='info',duration=4200){
    const stack = document.getElementById('toastStack'); if(!stack) return;
    const icons = {success:'bi-check-circle-fill',danger:'bi-exclamation-octagon-fill',warning:'bi-exclamation-triangle-fill',info:'bi-info-circle-fill'};
    const el = document.createElement('div');
    el.className = `ts-toast ${variant}`;
    el.innerHTML = `<i class="bi ${icons[variant]||icons.info} fs-5"></i><div class="flex-grow-1">${this.esc(msg)}</div>`;
    stack.appendChild(el);
    setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-10px)';setTimeout(()=>el.remove(),200)},duration);
  },
  async log(action,description){
    try{
      await Cloud.addActivity({ user_id: this.currentUser?._docId || null, user_name: this.currentUser?.full_name || 'Guest', action, description });
      this.activity.unshift({ user_name: this.currentUser?.full_name || 'Guest', action, description, created_at: this.now() });
      if(this.activity.length > 500) this.activity.pop();
    }catch(e){console.warn('log error',e)}
  },
  async notify(userId,title,message='',link=''){
    try{ await Cloud.addNotification({ user_id: userId, title, message, link }); }catch(e){console.warn(e)}
  },
  async notifyFounders(title,message,link=''){
    const founders = this.users.filter(u => u.role === 'founder' && u.status === 'active');
    for(const f of founders) await this.notify(String(f._docId), title, message, link);
  },
  unreadCount(){ if(!this.currentUser) return 0; return this.notifications.filter(n => !n.is_read).length; },

  requireFounder(){if(!this.requireAuth())return false;if(this.currentUser.role!=='founder'){this.toast('Founder access required.','danger');this.go('dashboard');return false}return true},

  async handleAvatarPick(input){
    const file = input.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')) return this.toast('Please pick an image file.','danger');
    if(file.size > MAX_AVATAR_SIZE) return this.toast('Image too big. Max 5 MB.','danger');

  },

  async doRegister(e){
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('regBtn');
    const fd = new FormData(form);
    const name = (fd.get('full_name')||'').trim();
    const email = (fd.get('email')||'').trim().toLowerCase();
    const pass = (fd.get('password')||'').trim();
    const confirm = (fd.get('password_confirm')||'').trim();
    const founderCode = (fd.get('founder_code')||'').trim();
    if(!name||name.length<3) return this.toast('Full name must be at least 3 characters.','danger');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return this.toast('Valid email required.','danger');
    if(pass.length<8) return this.toast('Password must be at least 8 characters.','danger');
    if(pass!==confirm) return this.toast('Passwords do not match.','danger');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating…';

    try {
      const existing = await Cloud.getUserByEmail(email);
      if(existing){
        btn.disabled = false; btn.innerHTML = 'Create Account';
        return this.toast('This email is already registered. Please login.','danger',6000);
      }
      const isFounder = founderCode === FOUNDER_CODE;
      await Cloud.createUser({
        full_name: name, email, password: pass,
        gender: fd.get('gender')||'prefer_not_to_say',
        age: parseInt(fd.get('age'))||null,
        sector: fd.get('sector')||'',
        bio: (fd.get('bio')||'').trim(),
        avatar: this._pendingAvatar||null,
        role: isFounder?'founder':'member',
        status: isFounder?'active':'pending',
        last_login: null
      });

      this.users = await Cloud.getUsers();

      if(isFounder){
        this.toast('✓ Founder account created! Login now.','success');
      } else {
        await this.notifyFounders('New member request', `${name} (${email}) requested access.`, 'admin-members');
        this.toast('Account created. Waiting for founder approval.','info',6000);
      }
      this.go('login');
    } catch(err){
      console.error(err);
      this.toast('Registration failed: ' + err.message, 'danger', 6000);
      btn.disabled = false; btn.innerHTML = 'Create Account';
    }
  },

  async doLogin(e){
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const fd = new FormData(e.target);
    const email = (fd.get('email')||'').trim().toLowerCase();
    const pass  = (fd.get('password')||'').trim();

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in…';

    try {
      const user = await Cloud.getUserByEmail(email);
      if(!user){
        btn.disabled = false; btn.innerHTML = 'Sign In';
        return this.toast('No account found with this email.','danger');
      }
      if(String(user.password||'').trim() !== pass){
        btn.disabled = false; btn.innerHTML = 'Sign In';
        return this.toast('Incorrect password.','danger');
      }
      if(user.status==='pending'){
        btn.disabled = false; btn.innerHTML = 'Sign In';
        return this.toast('Your account is awaiting founder approval.','warning',6000);
      }
      if(user.status==='suspended'){
        btn.disabled = false; btn.innerHTML = 'Sign In';
        return this.toast('Account suspended. Contact founder.','danger');
      }
      if(user.status==='deactivated'){
        btn.disabled = false; btn.innerHTML = 'Sign In';
        return this.toast('Account deactivated.','danger');
      }

      await Cloud.updateUser(user._docId, { last_login: this.now() });
      user.last_login = this.now();

      localStorage.setItem('ts_session_email', user.email);
      this.currentUser = user;
      this.notifications = await Cloud.getNotifications(String(user._docId));

      await this.log('login', `User logged in: ${email}`);
      this.toast(`✓ Welcome back, ${user.full_name}!`, 'success');
      this.go(user.role==='founder'?'admin':'dashboard');
    } catch(err){
      console.error(err);
      this.toast('Login failed: ' + err.message, 'danger', 6000);
      btn.disabled = false; btn.innerHTML = 'Sign In';
    }
  },

  async handleFilesPick(input){
    const files = Array.from(input.files||[]);
    for(const f of files){
      if(f.size>MAX_FILE_SIZE){this.toast(`"${f.name}" too big (max 1.5 MB).`,'danger');continue}
      const ok = ALLOWED_TYPES.includes(f.type) || /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|jpe?g|png|webp|gif)$/i.test(f.name);
      if(!ok){this.toast(`File type not allowed: ${f.name}`,'danger');continue}
      try{const data=await Utils.readAsDataURL(f);this._pendingFiles.push({name:f.name,type:f.type||'application/octet-stream',size:f.size,data})}catch(e){this.toast(`Could not read ${f.name}`,'danger')}
    }
    input.value=''; this.renderPendingFiles();
  },

  renderPendingFiles(){
    const el = document.getElementById('fileList'); if(!el) return;
    if(!this._pendingFiles.length){el.innerHTML='';return}
    el.innerHTML = this._pendingFiles.map((f,i)=>`<div class="file-preview"><i class="bi ${Utils.fileIcon(f.type,f.name)} file-ic"></i><div class="file-info"><div class="file-name">${this.esc(f.name)}</div><div class="file-meta">${Utils.fmtBytes(f.size)}</div></div><div class="file-actions"><button type="button" class="btn btn-sm btn-outline-secondary" onclick="App.previewData(${i})"><i class="bi bi-eye"></i></button><button type="button" class="btn btn-sm btn-outline-danger" onclick="App.removeFile(${i})"><i class="bi bi-x-lg"></i></button></div></div>`).join('');
  },
  previewData(i){const f=this._pendingFiles[i];if(!f)return;this.openPreview(f.name,f.type,f.data)},
  removeFile(i){if(!confirm('Remove this file?'))return;this._pendingFiles.splice(i,1);this.renderPendingFiles()},

  async saveSubmission(e, editId){
    e.preventDefault();
    const u = this.currentUser;
    const fd = new FormData(e.target);
    const data = {title:(fd.get('title')||'').trim(),work_type:fd.get('work_type')||'',sector:fd.get('sector')||'',problem:(fd.get('problem')||'').trim(),research:(fd.get('research')||'').trim(),findings:(fd.get('findings')||'').trim(),solution:(fd.get('solution')||'').trim(),attachments:this._pendingFiles};
    if(!data.title||!data.work_type||!data.problem) return this.toast('Title, type and problem required.','danger');
    const action = e.submitter?.value || 'save';
    const btn = e.submitter; if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm"></span> Saving…'}

    try {
      let subId;
      if(editId){
        const patch = {...data};
        if(action==='submit'){ patch.status='submitted'; patch.submitted_at=this.now(); patch.edit_permission=false; }
        await Cloud.updateSubmission(editId, patch);
        subId = editId;
      } else {
        subId = await Cloud.createSubmission({
          ...data,
          user_id: u._docId,
          status: action==='submit'?'submitted':'draft',
          edit_permission: false,
          submitted_at: action==='submit'?this.now():null
        });
      }

      const vCount = (await Cloud.getVersions(subId)).length;
      await Cloud.addVersion({
        submission_id: subId,
        version: vCount + 1,
        snapshot: JSON.stringify({...data, attachments: data.attachments.map(a=>({name:a.name,type:a.type,size:a.size}))}),
        changed_by: u._docId,
        change_type: editId ? 'update' : 'create'
      });

      if(action==='submit'){
        await this.log('submission.submit', `Submitted for review: ${data.title}`);
        await this.notifyFounders('New submission for review', `${u.full_name} submitted: "${data.title}"`, `view-submission/${subId}`);
        this.toast('✓ Submission sent for review.','success');
      } else {
        await this.log(editId?'submission.update':'submission.create', data.title);
        this.toast('✓ Draft saved.','success');
      }

      this.submissions = await Cloud.getSubmissions();
      this.go('view-submission/' + subId);
    } catch(err){
      console.error(err);
      this.toast('Save failed: ' + err.message, 'danger', 6000);
      if(btn){btn.disabled=false;btn.innerHTML='Save'}
    }
  },

  async toggleEditPermission(subId, granted){
    if(!this.requireFounder()) return;
    try {
      await Cloud.updateSubmission(subId, { edit_permission: granted ? true : false });
      const sub = this.submissions.find(s=>s._docId===subId);
      if(sub) sub.edit_permission = granted;
      if(sub){
        await this.log('permission.change', `${granted?'Granted':'Revoked'} edit permission for "${sub.title}"`);
        await this.notify(sub.user_id, granted ? '✓ Edit permission granted' : 'Edit permission revoked', granted ? `Founder granted you permission to edit "${sub.title}".` : `Founder revoked your edit permission for "${sub.title}".`, `view-submission/${subId}`);
      }
      this.toast(granted?'✓ Edit permission granted.':'Edit permission revoked.','success');
    } catch(e){ this.toast('Failed: '+e.message,'danger'); }
  },

  downloadFile(subId,fileIdx){
    const sub = this.submissions.find(s=>s._docId===subId);
    if(!sub?.attachments?.[fileIdx]) return this.toast('File not found.','danger');
    const f = sub.attachments[fileIdx];
    const a = document.createElement('a'); a.href = f.data; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    this.toast(`Downloading ${f.name}`,'success');
  },

  previewAttachment(subId,fileIdx){
    const sub = this.submissions.find(s=>s._docId===subId);
    if(!sub?.attachments?.[fileIdx]) return;
    const f = sub.attachments[fileIdx];
    this.openPreview(f.name,f.type,f.data);
  },

  openPreview(name,type,dataUrl){
    const modalEl = document.getElementById('filePreviewModal');
    document.getElementById('filePreviewTitle').textContent = name;
    const body = document.getElementById('filePreviewBody');
    document.getElementById('filePreviewDownload').onclick = ()=>{const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()};
    if(Utils.isPDF({type,name})) body.innerHTML = `<iframe class="preview-frame" src="${dataUrl}"></iframe>`;
    else if(Utils.isImage({type,name})) body.innerHTML = `<img src="${dataUrl}" class="preview-image">`;
    else if((type||'').includes('text')||/\.txt$/i.test(name)){
      try{const b64=dataUrl.split(',')[1];const text=decodeURIComponent(escape(atob(b64)));body.innerHTML=`<div class="preview-text">${this.esc(text)}</div>`}catch{body.innerHTML=`<div class="p-4">Cannot decode.</div>`}
    } else body.innerHTML = `<div class="p-4 text-center"><i class="bi bi-file-earmark fs-1" style="color:var(--ts-muted);"></i><p class="mt-3 mb-0" style="color:var(--ts-muted);">Preview not available.</p></div>`;
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
  },

  async deleteAttachment(subId,fileIdx){
    const sub = this.submissions.find(s=>s._docId===subId);
    if(!sub) return;
    const isOwner = sub.user_id===this.currentUser._docId;
    const isFounder = this.currentUser.role==='founder';
    if(!isOwner && !isFounder) return this.toast('Not allowed.','danger');
    if(isOwner && sub.status!=='draft' && !sub.edit_permission) return this.toast('Cannot delete — locked.','danger');
    const f = sub.attachments[fileIdx]; if(!f) return;
    if(!confirm(`Delete "${f.name}"?`)) return;
    try {
      const newAttachments = [...sub.attachments]; newAttachments.splice(fileIdx,1);
      await Cloud.updateSubmission(subId, { attachments: newAttachments });
      sub.attachments = newAttachments;
      await this.log('attachment.delete',`${sub.title} — ${f.name}`);
      this.toast('✓ Deleted.','success');
      this.pageViewSubmission(subId);
    } catch(e){ this.toast('Failed: '+e.message,'danger'); }
  },

  async founderSubmissionAction(id,action){
    if(!this.requireFounder()) return;
    const sub = this.submissions.find(s=>s._docId===id);
    if(!sub) return;
    const newStatus = {approve:'approved',archive:'archived',restore:'approved'}[action];
    if(!newStatus) return;
    try {
      await Cloud.updateSubmission(id, { status: newStatus });
      sub.status = newStatus;
      const vCount = (await Cloud.getVersions(id)).length;
      await Cloud.addVersion({ submission_id: id, version: vCount+1, snapshot: JSON.stringify({status:newStatus}), changed_by: this.currentUser._docId, change_type: action });
      await this.log(`submission.${action}`, sub.title);
      await this.notify(sub.user_id, `Submission ${action}d`, `Your submission "${sub.title}" was ${action}d.`, `view-submission/${id}`);
      this.toast(`✓ Submission ${action}d.`,'success');
      this.pageViewSubmission(id);
    } catch(e){ this.toast('Failed: '+e.message,'danger'); }
  },

  async handleAvatarPickEdit(input){
    const file = input.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')) return this.toast('Please pick an image.','danger');
    if(file.size>MAX_AVATAR_SIZE) return this.toast('Max 5 MB.','danger');
    this.toast('Processing…','info',1500);
    try{const c=await Utils.compressImage(file,320,0.82);this._pendingAvatar=c;document.getElementById('avatarPreviewEdit').innerHTML=`<img src="${c}" class="avatar-lg">`}catch(e){this.toast('Failed.','danger')}
  },
  removeAvatar(){this._pendingAvatar=null;document.getElementById('avatarPreviewEdit').innerHTML=this.avatarHtml(this.currentUser,'avatar-lg');this.toast('Will be removed.','info')},

  async saveProfile(e){
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    const fd = new FormData(e.target);
    try {
      await Cloud.updateUser(this.currentUser._docId, {
        full_name: (fd.get('full_name')||'').trim(),
        gender: fd.get('gender'),
        age: parseInt(fd.get('age'))||null,
        sector: fd.get('sector')||'',
        bio: (fd.get('bio')||'').trim(),
        avatar: this._pendingAvatar
      });
      await this.refreshUser();
      await this.log('profile.update','Profile updated');
      this.toast('✓ Saved.','success');
      this.go('profile');
    } catch(err){ this.toast('Failed: '+err.message,'danger'); btn.disabled=false; btn.innerHTML='Save'; }
  },

    if(!this.requireFounder()) return;
    const activity = this.activity;
    document.getElementById('app').innerHTML = `
    <div class="container-fluid py-4 px-lg-5"><div class="row g-0">
      <div class="col-lg-3 col-xl-2">${this.sidebar('admin-activity')}</div>
      <div class="col-lg-9 col-xl-10 ps-lg-4 py-3">
        <h3 class="mb-4">Activity Log (${activity.length})</h3>
        <div class="card"><div class="card-body">
          ${activity.length?activity.map(a=>`<div class="activity-item"><span class="activity-dot"></span><strong>${this.esc(a.user_name||'System')}</strong> <code class="small" style="background:rgba(124,92,255,.12);color:var(--ts-primary-2);padding:.1rem .4rem;border-radius:4px;">${a.action}</code> — ${this.esc(a.description||'')}<span class="small ms-2" style="color:var(--ts-muted);">${this.fmt(a.created_at)}</span></div>`).join(''):'<div class="empty-state"><i class="bi bi-activity"></i><h6>No activity</h6></div>'}
        </div></div>
      </div>
    </div></div>`;
  },

  page404(){
    document.getElementById('app').innerHTML = `<div class="container py-5 text-center"><h1 class="display-1">404</h1><a href="#home" class="btn btn-primary">Go Home</a></div>`;
  }
};

document.addEventListener('DOMContentLoaded',()=>{
  const savedTheme = localStorage.getItem('ts_theme');
  if(savedTheme) document.documentElement.setAttribute('data-bs-theme', savedTheme);
  App.init();
});
</script>
</body>
</html>
